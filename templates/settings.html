<!DOCTYPE html>
<html>
    <body>
        {% load static %}
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=0.65">
            <link rel="stylesheet" href="{% static "css/style.css" %}">
            <link rel="stylesheet" href="{% static "css/window.css" %}">
            <title>LunarChat Settings</title>
            <meta charset="UTF-8">
            <style>p {
  font-size: 12px;
}</style>
            <script>function red(pageUrl) {
    window.location.href = pageUrl;
}</script>
        </head>
    <center>
    <br><br><br><br><br>
<div class="window active" style="max-width: 300px">
  <div class="title-bar">
    <div class="title-bar-text">Настройки профиля ({{nick}})</div>
    <div class="title-bar-controls">
      <button aria-label="Minimize"></button>
      <button aria-label="Maximize"></button>
      <button aria-label="Close"></button>
    </div>
  </div>
  <div class="window-body has-space">
    <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p>Загрузить новую аватарку (.png):</p>
    <input type="file" name="avatar" accept="image/png" required>
    <br><br>
    <button type="submit">Сохранить</button>
    <button type="button" onclick="red('/')">Назад</button>
    </form>
  </div>
</div>
    </center>
</body>
</html>
