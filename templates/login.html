<!DOCTYPE html>
<html>
    <body>
        {% load static %}
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=0.65">
            <link rel="stylesheet" href="{% static "css/style.css" %}">
            <link rel="stylesheet" href="{% static "css/window.css" %}">
            <title>LunarChat Alpha Sign Up</title>
            <meta chatset="UTF-8">
            <style>p {
  font-size: 12px;
}</style>
            <script>function red(pageUrl) {
    window.location.href = pageUrl;
}</script>
        </head>
    <center>
    <br><br><br><br><br>
<div class="window active" style="max-width: 300px">
  <div class="title-bar">
    <div class="title-bar-text">Sign up</div>
    <div class="title-bar-controls">
      <button aria-label="Minimize"></button>
      <button aria-label="Maximize"></button>
      <button aria-label="Close"></button>
    </div>
  </div>
  <div class="window-body has-space">
    <form method="post">
    <p>Введите имя и пароль к нему</p>
    {% csrf_token %}
{{form.as_p}}
<button type="submit">Создать</button>
<button onclick="red('/')">Назад</button>
    </form>
  </div>
</div>
    </center>
</body>
</html>
